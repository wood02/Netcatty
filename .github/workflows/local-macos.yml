name: macOS Apple Silicon local build

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-arm64-local
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.upstream.outputs.source_sha }}
      build_required: ${{ steps.upstream.outputs.build_required }}
    steps:
      - name: Check for upstream updates
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          source_sha=$(gh api repos/binaricat/Netcatty/commits/main --jq '.sha')
          last_built_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/build/macos-source" --jq '[.[] | select(.ref == "refs/heads/build/macos-source")][0].object.sha // ""')
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "Upstream commit: ${source_sha}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$source_sha" == "$last_built_sha" && "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "build_required=false" >> "$GITHUB_OUTPUT"
            echo "This upstream commit is already built." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            echo "Building this upstream commit." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: check
    if: needs.check.outputs.build_required == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: binaricat/Netcatty
          ref: ${{ needs.check.outputs.source_sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download bundled clients
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ET_BIN_OWNER: binaricat
        run: |
          npm run fetch:mosh -- --platform=darwin --arch=universal --resolve-release
          npm run fetch:et -- --platform=darwin --arch=universal --resolve-release
          test -x resources/mosh/darwin-universal/mosh-client
          test -x resources/et/darwin-universal/et

      - name: Build Apple Silicon package
        run: |
          npm pkg set version="0.0.0-sha-$(git rev-parse --short=7 HEAD)"
          npm run build
          npx electron-builder --config electron-builder.config.cjs --mac dmg --arm64 -c.mac.identity=- -c.mac.notarize=false --publish=never

      - name: Verify packaged app
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/Netcatty.app
          lipo release/mac-arm64/Netcatty.app/Contents/MacOS/Netcatty -verify_arch arm64
          node scripts/test-packaged-ssh-ciphers.cjs

      - name: Generate checksums
        run: |
          cd release
          shasum -a 256 *.dmg > SHA256SUMS.txt

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: netcatty-macos-arm64-${{ needs.check.outputs.source_sha }}
          path: |
            release/*.dmg
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Record successful upstream build
        run: git push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/build/macos-source
